spring:
  application:
    name: order-service
  profiles:
    active: dev
  config:
    import:
      - nacos:${spring.application.name}.${spring.cloud.nacos.config.file-extension}
  cloud:
    nacos:
      config:
        file-extension: yml
        namespace: ${spring.profiles.active}
      username: nacos
      password: Leng@123
      server-addr: 127.0.0.1:8848
      discovery:
        namespace: ${spring.profiles.active}
  datasource:
    driver-class-name: org.postgresql.Driver
    username: ecommerce_usr
    password: password
    url: jdbc:postgresql://localhost:8432/db_order
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8550