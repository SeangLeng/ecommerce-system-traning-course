spring:
  application:
    name: gateway-service
  profiles:
    active: dev
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          trusted-proxies: ".*" # to enable the CORS
    #          routes:
#            - id: order-service
#              uri: lb://order-service # order-service is the application name
#              predicates:
#                - Path=/order-service/**
#              filters:
#                - RewritePath=/order-service/?(?<segment>.*), /$\{segment}
    nacos:
      username: nacos
      password: Leng@123
      server-addr: 127.0.0.1:8848
      discovery:
        namespace: ${spring.profiles.active}

management:
  endpoints:
    web:
      exposure:
        include: "*"  # Exposes all endpoints before actuator over HTTP
  endpoint:
    health:
      show-details: always  # Shows full disk, DB, and component health details

server:
  port: 8585

springdoc:
  swagger-ui:
    urls:
      - name: Order Service
        url: /order-service/v3/api-docs
      - name: Customer Service
        url: /customer-service/v3/api-docs
      - name: Payment Service
        url: /payment-service/v3/api-docs
      - name: Business Service
        url: /business-service/v3/api-docs