spring:
  application:
    name: gateway-service
  profiles:
    active: dev
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true # can set false when used routes.
              lower-case-service-id: true
          trusted-proxies: ".*" # to enable the CORS
          routes:
#            - id: vue-js # Register frontend to gateway.
#              uri: http://[::1]:5173 # order-service is the application name
#              predicates:
#                - Path=/**

          # To forward token to downstream service
          # spring.cloud.gateway.webflux.default-filters:
          #   - TokenRelay=Ï
          default-filters:
            - SaveSession
            - TokenRelay=
    nacos:
      username: nacos
      password: Leng@123
      server-addr: 127.0.0.1:8848
      discovery:
        namespace: ${spring.profiles.active}
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri:  http://localhost:8888/realms/ecommerce
        registration:
          ecommerce-postman:
            client-id: ecommerce-postman
#            client-secret: secret
            provider: keycloak
            scope:
              - openid
              - email
              - profile
            authorization-grant-type: authorization_code
            redirect-uri: "http://localhost:8585/login/oauth2/code/ecommerce-postman"
  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: 'health,info,gateway'
  endpoint:
    gateway:
      access: read_only

server:
  port: 8585


scalar:
  sources:
    - title: Order Service
      url: /order-service/v3/api-docs
    - title: Customer Service
      url: /customer-service/v3/api-docs
    - title: Payment Service
      url: /payment-service/v3/api-docs
    - title: Business Service
      url: /business-service/v3/api-docs
    - title: User Service
      url: /user-service/v3/api-docs

springdoc:
  swagger-ui:
    urls:
      - name: Order Service
        url: /order-service/v3/api-docs
      - name: Customer Service
        url: /customer-service/v3/api-docs
      - name: Payment Service
        url: /payment-service/v3/api-docs
      - name: Business Service
        url: /business-service/v3/api-docs
      - name: User Service
        url: /user-service/v3/api-docs
#    enabled: false # can use on production
