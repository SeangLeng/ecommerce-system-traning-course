volumes:
  ecommerce-pg_vol:
networks:
  ecommerce-net:
    external: true

services:
  ecommerce-pg:
    image: postgres:18.6
    container_name: ecommerce_pg
    ports:
      - "8432:5432"
    environment:
      POSTGRES_USER: ecommerce_usr
      POSTGRES_PASSWORD: password
    volumes:
      - ecommerce-pg_vol:/var/lib/postgresql/18/docker
      - ./init_scripts:/docker-entrypoint-initdb.d
    networks:
      - ecommerce-net
